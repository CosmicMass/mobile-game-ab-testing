[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-game-ab-testing"
version = "0.1.0"
description = "Retention and A/B-test analysis for mobile game player data, from raw export to a defensible decision"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyright>=1.1.400", "pandas-stubs>=2.2", "numpy>=1.26"]
# Only needed to regenerate the README images via docs/render_figures.py.
# Kept out of `dev` because it pulls a headless-Chrome download it never uses
# in the test or type-check path.
figures = ["kaleido>=1.0"]

[tool.pyright]
include = ["src", "examples", "docs"]
# Specifying our own exclude REPLACES pyright's defaults, it does not merge
# with them -- so **/node_modules and **/.* (all dotfiles/dotdirs) are kept
# here explicitly. "examples" and "docs" are in include on purpose: a
# runnable script that stops type-checking is one that quietly rots.
#
# "tests" is excluded, not merely left out of include: an editor's language
# server type-checks any file you open regardless of include, and the test
# suite pokes at pandas `.loc[label, col]` scalars (stubbed as a union that
# contains `complex`, so `int(...)` "fails") and plotly trace internals
# (`figure.data[0].x`, loosely typed) -- correct at runtime, un-typeable
# without burying every assertion in casts. The shipped library and the
# example scripts are the type-checked surface; the tests are run, not typed.
exclude = ["**/__pycache__", ".venv", "**/node_modules", "**/.*", "tests"]
typeCheckingMode = "basic"
reportMissingImports = "error"
# Without these pyright resolves imports against whatever interpreter it finds
# on PATH rather than the project venv, and reports every third-party import as
# unresolved -- 9 phantom errors that look like a code problem and are not.
venvPath = "."
venv = ".venv"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
